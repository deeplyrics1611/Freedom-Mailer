<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuoteMail — Gmail RFQ sender</title>
  <link rel="icon" href="/phone.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="fx-world" aria-hidden="true">
    <svg viewBox="0 0 400 400" class="globe">
      <ellipse cx="200" cy="200" rx="148" ry="148" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <ellipse cx="200" cy="200" rx="70" ry="148" fill="none" stroke="currentColor" stroke-width=".7"/>
      <ellipse cx="200" cy="200" rx="120" ry="148" fill="none" stroke="currentColor" stroke-width=".7"/>
      <ellipse cx="200" cy="200" rx="148" ry="48" fill="none" stroke="currentColor" stroke-width=".7"/>
      <ellipse cx="200" cy="200" rx="148" ry="96" fill="none" stroke="currentColor" stroke-width=".7"/>
      <line x1="52" y1="200" x2="348" y2="200" stroke="currentColor" stroke-width=".7"/>
      <line x1="200" y1="52" x2="200" y2="348" stroke="currentColor" stroke-width=".7"/>
    </svg>
  </div>
  <img class="fx-phoenix" src="/phoenix-3d.jpg" alt="" aria-hidden="true" />
  <svg class="fx-phone" viewBox="0 0 120 200" aria-hidden="true">
    <rect x="34" y="18" width="52" height="108" rx="11" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <rect x="52" y="24" width="16" height="5" rx="2.5" fill="currentColor"/>
    <circle cx="60" cy="114" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M94 48c11 8 11 28 0 36M106 38c18 14 18 46 0 60" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M28 154c8-10 56-10 64 0 2 3 1 8-3 10H31c-4-2-5-7-3-10z" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <path d="M36 154v-8M84 154v-8" fill="none" stroke="currentColor" stroke-width="2.2"/>
  </svg>
  <div class="fx-fire" aria-hidden="true"></div>
  <div class="fx-scan" aria-hidden="true"></div>

  <!-- Login -->
  <div id="login" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="brand">QuoteMail</div>
      <p class="muted logo-phone-row"><img class="logo-phone" src="/phone.svg" alt=""> root@phoenix — gmail rfq + sms // app-password rotation</p>
      <input id="login-email" type="email" placeholder="Email" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand">QuoteMail</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="who" class="muted small"></div>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>
    <main id="view"></main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
